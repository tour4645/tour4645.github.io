<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Txur Oracle | GPS Travel Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Sarabun:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #16161a;
            --accent-color: #facc15;
            /* Quantum Gold */
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', 'Sarabun', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(250, 204, 21, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--accent-color);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #map {
            flex-grow: 1;
            width: 100%;
        }

        /* Leaflet Dark Theme Adjustments */
        .leaflet-container {
            background: #111 !important;
        }

        footer {
            padding: 0.75rem 2rem;
            background: var(--card-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .oracle-tag {
            font-weight: 600;
            color: var(--text-main);
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 12px;
            padding: 4px;
        }

        .leaflet-popup-tip {
            background: var(--card-bg);
        }

        .popup-header {
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .popup-body {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .popup-meta {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            gap: 10px;
        }

        .battery-icon {
            display: inline-block;
            width: 12px;
            height: 6px;
            border: 1px solid currentColor;
            position: relative;
            margin-right: 4px;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 1px;
            width: 2px;
            height: 4px;
            background: currentColor;
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>Chiang Mai → Phitsanulok</h1>
            <div style="font-size: 0.8rem; color: var(--text-dim);">GPS Tracking Analysis | PSRU Workshop Wave</div>
        </div>
        <div class="status-badge">Quantum Core Active</div>
    </header>

    <div id="map"></div>

    <footer>
        <div>Generated with curiosity by <span class="oracle-tag">Txur Oracle</span></div>
        <div>28 Feb 2026 | PSUR, Phitsanulok</div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Initialize Map
        const map = L.map('map').setView([18.7883, 98.9853], 8);

        // Dark Theme Tiles (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Function to parse CSV
        async function loadTravelData() {
            try {
                const response = await fetch('travel-phitsanulok.csv');
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Skip header

                const points = [];

                rows.forEach(row => {
                    const cols = row.split(',');
                    if (cols.length < 13) return;

                    const lat = parseFloat(cols[4]);
                    const lon = parseFloat(cols[5]);

                    if (isNaN(lat) || isNaN(lon)) return;

                    const battery = cols[2];
                    const address = cols[11]?.replace(/"/g, '') || cols[10] || "Unknown Location";
                    const time = cols[12];
                    const place = cols[8] || cols[10];

                    points.push([lat, lon]);

                    // Add Marker
                    const marker = L.circleMarker([lat, lon], {
                        radius: 5,
                        fillColor: "#facc15",
                        color: "#000",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);

                    marker.bindPopup(`
                        <div class="popup-header">${place || 'Waypoint'}</div>
                        <div class="popup-body">${address}</div>
                        <div class="popup-meta">
                            <span>🕒 ${time}</span>
                            <span>🔋 ${battery}%</span>
                        </div>
                    `);
                });

                // Connect the dots
                if (points.length > 0) {
                    const polyline = L.polyline(points, {
                        color: '#facc15',
                        weight: 3,
                        opacity: 0.6,
                        smoothFactor: 1
                    }).addTo(map);

                    // Zoom to fit bounds
                    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                }

            } catch (error) {
                console.error('Error loading CSV:', error);
                document.getElementById('map').innerHTML = '<div style="padding: 2rem; color: #ff5555;">Error loading CSV data. Please ensure travel-phitsanulok.csv is in the same folder.</div>';
            }
        }

        loadTravelData();
    </script>
</body>

</html>
