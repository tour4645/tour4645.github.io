<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Txur Oracle | GPS Travel Map</title>
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --accent-color: #facc15;
            --text-main: #ffffff;
            --panel-bg: rgba(15, 15, 15, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex-grow: 1;
            width: 100%;
            z-index: 1;
        }

        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        footer {
            background: #000;
            color: var(--accent-color);
            padding: 10px 20px;
            font-size: 0.75rem;
            text-align: center;
            border-top: 1px solid #222;
            z-index: 1000;
        }

        /* Custom Leaflet Dark Theme */
        .leaflet-container {
            background: #000 !important;
        }

        .leaflet-popup-content-wrapper {
            background: var(--panel-bg);
            color: white;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            backdrop-filter: blur(10px);
        }

        .leaflet-popup-tip {
            background: var(--accent-color);
        }

        .popup-info b {
            color: var(--accent-color);
        }
    </style>
</head>

<body>
    <header>
        <h1>Oracle Quantum Map</h1>
        <div class="stats" id="status">Analyzing GPS Waypoints...</div>
    </header>

    <div id="map"></div>

    <footer>
        Txur Oracle | Two Rivers Oracle Project | 2026
    </footer>

    <!-- Leaflet.js JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Init Map
        const map = L.map('map').setView([17.5, 100.0], 8);

        // Dark Theme Layer (CartoDB DarkMatter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Robust CSV Parser
        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let col = "";
            let row = [];
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                const next = str[i + 1];
                if (char === '"' && quote && next === '"') { col += char; i++; continue; }
                if (char === '"') { quote = !quote; continue; }
                if (char === ',' && !quote) { row.push(col.trim()); col = ""; continue; }
                if ((char === '\n' || char === '\r\n') && !quote) {
                    if (col || row.length) { row.push(col.trim()); arr.push(row); }
                    col = ""; row = [];
                    if (char === '\r' && next === '\n') i++;
                    continue;
                }
                col += char;
            }
            if (col || row.length) { row.push(col.trim()); arr.push(row); }
            return arr;
        }

        async function loadData() {
            try {
                const response = await fetch('travel-phitsanulok.csv');
                const csvData = await response.text();
                const rows = parseCSV(csvData).slice(1); // Skip header

                const latlngs = [];
                let latestPoint = null;

                rows.forEach((cols, index) => {
                    const lat = parseFloat(cols[4]);
                    const lon = parseFloat(cols[5]);

                    if (!isNaN(lat) && !isNaN(lon)) {
                        const point = [lat, lon];
                        latlngs.push(point);
                        latestPoint = point;

                        const place = cols[10] || cols[8] || "Route Update";
                        const time = cols[12] ? cols[12].split(' ')[1] : "Unknown";
                        const battery = cols[2];

                        const marker = L.circleMarker(point, {
                            radius: (index === 0 || index === rows.length - 1) ? 8 : 4,
                            fillColor: (index === 0) ? "#22c55e" : (index === rows.length - 1) ? "#ef4444" : "#facc15",
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).addTo(map);

                        marker.bindPopup(`
                            <div class="popup-info">
                                <b>Location:</b> ${place}<br>
                                <b>Time:</b> ${time}<br>
                                <b>Battery:</b> ${battery}%
                            </div>
                        `);
                    }
                });

                if (latlngs.length > 0) {
                    // Draw Polyline
                    const polyline = L.polyline(latlngs, {
                        color: '#facc15',
                        weight: 2,
                        opacity: 0.6,
                        dashArray: '5, 10'
                    }).addTo(map);

                    // Zoom to fit the entire route
                    map.fitBounds(polyline.getBounds(), { padding: [50, 50] });
                    document.getElementById('status').innerText = `Path Active: ${latlngs.length} Quantum Waypoints`;
                }

            } catch (err) {
                console.error("Failed to load GPS data:", err);
                document.getElementById('status').innerText = "Data Load Failed: Check CSV path";
            }
        }

        loadData();
    </script>
</body>

</html>
