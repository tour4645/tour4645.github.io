<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum DustBoy Planets | Data Interactive Game</title>
    <style>
        :root {
            --accent: #00f3ff;
            --gold: #facc15;
            --danger: #ff0055;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.85);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .card {
            background: var(--glass);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(20px);
            pointer-events: auto;
            max-width: 320px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .instruction {
            margin-top: 15px;
            font-size: 0.85rem;
            opacity: 0.8;
            line-height: 1.6;
        }

        .highlight-text {
            color: var(--gold);
            font-weight: 700;
        }

        #status-stream {
            margin-top: 10px;
            font-size: 0.75rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
        }

        #planet-info {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background: var(--glass);
            border-radius: 40px;
            border: 1px solid var(--accent);
            font-weight: 600;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--accent);
            font-size: 1.4rem;
            letter-spacing: 5px;
            font-weight: 800;
        }

        .btn-back {
            position: absolute;
            top: 25px;
            right: 25px;
            background: var(--glass);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .btn-back:hover {
            border-color: var(--accent);
            background: rgba(0, 243, 255, 0.1);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="loading">QUANTUM DATA SYNCING...</div>

    <div id="ui-overlay">
        <div class="card">
            <h1>DUSTBOY PLANETS</h1>
            <div id="status-stream">
                <div class="pulse-dot"></div>
                <span>STREAMING REAL-TIME DATA</span>
            </div>
            <div class="instruction">
                แต่ละ "ดาวเคราะห์" คือสถานีวัดฝุ่นจริง!<br><br>
                🪐 <span class="highlight-text">ขนาดของดาว:</span> เปลี่ยนตามค่า PM2.5<br>
                💧 <span class="highlight-text">สีน้ำนวล:</span> หยิบและวางได้นุ่มนวลที่สุด<br>
                🛰️ <span class="highlight-text">การควบคุม:</span> <span style="font-size: 0.8rem;">(L-Click) หยิบย้าย |
                    (R-Click) หมุนกล้อง</span>
            </div>
        </div>
    </div>

    <div id="planet-info">Station: Waiting for Data...</div>

    <a href="index.html" class="btn-back">⬅️ EXIT TO HUB</a>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { DragControls } from 'three/addons/controls/DragControls.js';

        let scene, camera, renderer, orbit, drag;
        let planetMeshes = [];
        let planets = {}; // Data storage for stations
        let starField;

        init();
        initMQTT();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.Fog(0x020617, 50, 400);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(0, 100, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Orbit Controls (Right click only for rotation)
            orbit = new OrbitControls(camera, renderer.domElement);
            orbit.enableDamping = true;
            orbit.mouseButtons = {
                LEFT: null,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.ROTATE
            };

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const sunLight = new THREE.PointLight(0xffffff, 15, 600);
            sunLight.position.set(50, 200, 50);
            scene.add(sunLight);

            // Back Starfield
            const starGeo = new THREE.BufferGeometry();
            const starCount = 8000;
            const starPos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i++) {
                starPos[i] = (Math.random() - 0.5) * 1800;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.6 });
            starField = new THREE.Points(starGeo, starMat);
            scene.add(starField);

            // Space Grid
            const grid = new THREE.GridHelper(800, 60, 0x00f3ff, 0x0a1629);
            grid.position.y = -20;
            scene.add(grid);

            // Initialize Drag Controls
            drag = new DragControls(planetMeshes, camera, renderer.domElement);

            drag.addEventListener('dragstart', (event) => {
                orbit.enabled = false;
                showInfo(event.object.userData.name, event.object.userData.pm25);

                // ULTRA SMOOTH: Scale up with GSAP
                gsap.to(event.object.scale, { x: 1.4, y: 1.4, z: 1.4, duration: 0.5, ease: "back.out(2)" });
                gsap.to(event.object.material, { emissiveIntensity: 1.5, duration: 0.3 });
            });

            drag.addEventListener('dragend', (event) => {
                orbit.enabled = true;
                hideInfo();

                // ULTRA SMOOTH: Land with bounce
                gsap.to(event.object.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" });
                gsap.to(event.object.material, { emissiveIntensity: 0.4, duration: 0.5 });

                // Smoothly snap to grid floor if too low
                if (event.object.position.y < -15) {
                    gsap.to(event.object.position, { y: 0, duration: 1, ease: "power2.out" });
                }
            });

            animate();

            // Hide loading
            const loader = document.getElementById('loading');
            setTimeout(() => {
                gsap.to(loader, { opacity: 0, duration: 1, onComplete: () => loader.style.display = 'none' });
            }, 1500);
        }

        function createPlanet(id, pm25, name) {
            const size = Math.max(3, pm25 / 5);
            let color = 0x00f3ff;
            if (pm25 > 25) color = 0x10b981;
            if (pm25 > 37) color = 0xfacc15;
            if (pm25 > 50) color = 0xef4444;
            if (pm25 > 90) color = 0xa855f7;

            const geometry = new THREE.SphereGeometry(size, 32, 32);
            const material = new THREE.MeshPhongMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.4,
                shininess: 80,
                transparent: true,
                opacity: 0.9
            });

            const mesh = new THREE.Mesh(geometry, material);

            // Random Initial Position
            const angle = Math.random() * Math.PI * 2;
            const dist = 40 + Math.random() * 150;
            mesh.position.set(Math.cos(angle) * dist, Math.random() * 40, Math.sin(angle) * dist);

            mesh.userData = { id, pm25, name };
            scene.add(mesh);
            planetMeshes.push(mesh);

            // Add Saturn Ring if PM2.5 is high
            if (pm25 > 37) {
                const ringGeo = new THREE.TorusGeometry(size * 1.8, 0.2, 2, 64);
                const ringMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.4 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                mesh.add(ring);
            }

            // Pop-in animation
            mesh.scale.set(0, 0, 0);
            gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 1.5, ease: "elastic.out(1, 0.5)" });

            return mesh;
        }

        function initMQTT() {
            try {
                const client = mqtt.connect('wss://dustboy-wss-bridge.laris.workers.dev/mqtt');
                client.on('connect', () => {
                    client.subscribe('DUSTBOY/+/+/+/status');
                });

                client.on('message', (topic, msg) => {
                    const data = JSON.parse(msg.toString());
                    const id = topic.split('/')[2];
                    const pm25 = parseFloat(data.pm25) || 0;
                    const name = data.nickname || data.nickname_en || `ID-${id}`;

                    if (!planets[id]) {
                        planets[id] = createPlanet(id, pm25, name);
                    } else {
                        // Update existing planet data
                        planets[id].userData.pm25 = pm25;
                        // Optional: Smoothly transition color/size here if needed
                    }
                });
            } catch (err) { console.error("MQTT Lab Error:", err); }
        }

        function showInfo(name, pm25) {
            const info = document.getElementById('planet-info');
            info.innerHTML = `📡 Station: <span style="color:var(--accent)">${name}</span> | PM2.5: <span class="highlight-text">${pm25.toFixed(1)}</span>`;
            info.style.opacity = '1';
        }

        function hideInfo() {
            document.getElementById('planet-info').style.opacity = '0';
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (orbit) orbit.update();
            if (starField) starField.rotation.y += 0.0003;

            // Cosmic Float for all planets
            planetMeshes.forEach((mesh, i) => {
                if (!mesh.isDragging) {
                    mesh.position.y += Math.sin(time + i) * 0.02;
                    mesh.rotation.y += 0.005;
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
