<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum DustBoy 3D | Ultimate Visual</title>
    <style>
        :root {
            --accent: #00f3ff;
            --danger: #ff0055;
            --bg: #020617;
            --glass: rgba(15, 23, 42, 0.82);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .card {
            background: var(--glass);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(0, 243, 255, 0.25);
            backdrop-filter: blur(15px);
            margin-bottom: 20px;
            pointer-events: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .status {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #334155;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            z-index: 100;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        .pm25-val {
            font-weight: 800;
            font-family: monospace;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--accent);
            font-size: 1.4rem;
            letter-spacing: 5px;
            font-weight: 700;
            transition: opacity 0.8s;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Sarabun:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="loading">QUANTUM CORE INITIALIZING...</div>

    <div id="ui-overlay">
        <div class="card">
            <h1>DUSTBOY 3D VISUAL</h1>
            <div class="status">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">CONNECTING TO WSS...</span>
            </div>
            <div style="margin-top: 15px; font-size: 0.8rem; opacity: 0.7; line-height: 1.6;">
                Real-time Cyber City of Air Quality<br>
                Height & Color = PM2.5 Level
            </div>
        </div>
    </div>

    <div id="leaderboard">
        <div class="card">
            <div
                style="font-weight: 800; font-size: 0.95rem; margin-bottom: 15px; color: var(--accent); letter-spacing: 2px;">
                LIVE DATA STREAMing
            </div>
            <div id="hotspot-list">
                <div style="font-size: 0.8rem; opacity: 0.5;">Scanning Quantum Lattice...</div>
            </div>
        </div>
    </div>

    <div class="legend">
        Created by Antigravity Oracle | Final Quiz PSRU | 2026
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let towers = {};
        let starField;
        let scanLine;
        let dataRings = [];

        init3D();
        initMQTT();

        function init3D() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020617);
                scene.fog = new THREE.Fog(0x020617, 10, 250);

                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2500);
                camera.position.set(60, 60, 60);

                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(renderer.domElement);

                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.4;
                controls.maxDistance = 300;
                controls.minDistance = 20;

                // Lighting
                scene.add(new THREE.AmbientLight(0xffffff, 0.4));
                const pLight = new THREE.PointLight(0x00f3ff, 10, 300);
                pLight.position.set(0, 150, 0);
                scene.add(pLight);

                // ULTRA: Cosmic Starfield
                const starGeo = new THREE.BufferGeometry();
                const starCount = 8000;
                const starPos = new Float32Array(starCount * 3);
                for (let i = 0; i < starCount * 3; i++) {
                    starPos[i] = (Math.random() - 0.5) * 1500;
                }
                starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.6 });
                starField = new THREE.Points(starGeo, starMat);
                scene.add(starField);

                // Cyber Grid
                const grid = new THREE.GridHelper(600, 100, 0x00f3ff, 0x0a101f);
                grid.position.y = -0.1;
                scene.add(grid);

                // Scanline Effect
                const scanGeo = new THREE.PlaneGeometry(600, 4);
                const scanMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.08, side: THREE.DoubleSide });
                scanLine = new THREE.Mesh(scanGeo, scanMat);
                scanLine.rotation.x = Math.PI / 2;
                scene.add(scanLine);

                animate();

                const loader = document.getElementById('loading');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 800);
            } catch (err) {
                console.error("3D Error:", err);
                document.getElementById('loading').innerText = "FATAL: " + err.message;
            }
        }

        function createRing(pos, color) {
            const ringGeo = new THREE.RingGeometry(0.5, 0.8, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pos);
            ring.position.y = 0.3;
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);
            dataRings.push({ mesh: ring, scale: 1, opacity: 0.7 });
        }

        function createTower(id, name) {
            const group = new THREE.Group();

            // Core Base
            const baseGeo = new THREE.CylinderGeometry(1.5, 1.8, 0.3, 6);
            const baseMat = new THREE.MeshPhongMaterial({ color: 0x0f172a, emissive: 0x00f3ff, emissiveIntensity: 0.3 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            group.add(base);

            // Data Crystal (Main Bar)
            const barGeo = new THREE.CylinderGeometry(0.8, 0.8, 1, 6);
            const barMat = new THREE.MeshPhongMaterial({
                color: 0x00f3ff, transparent: true, opacity: 0.6,
                emissive: 0x00f3ff, emissiveIntensity: 0.5, shininess: 100
            });
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.y = 0.5;
            group.add(bar);

            // Signal Hub (Top Cap)
            const topGeo = new THREE.SphereGeometry(0.9, 8, 8);
            const topMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 1;
            group.add(top);

            // Satellite Cube
            const satGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const satMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const sat = new THREE.Mesh(satGeo, satMat);
            group.add(sat);

            // Random Position
            const angle = Math.random() * Math.PI * 2;
            const radius = 30 + Math.random() * 80;
            group.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);

            scene.add(group);
            return { group, bar, top, sat, val: 0, name, color: 0x00f3ff, textLabel: null };
        }

        function createTextSprite(text, color) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            // Background for readability
            ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
            ctx.roundRect ? ctx.roundRect(0, 0, 512, 128, 20) : ctx.fillRect(0, 0, 512, 128);
            ctx.fill();

            ctx.font = '800 64px "Outfit", "Sarabun", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Glow effect
            ctx.shadowColor = color;
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(12, 3, 1);
            return sprite;
        }

        function updateTower(id, pm25, name) {
            if (!towers[id]) towers[id] = createTower(id, name);

            const tower = towers[id];

            // If it's real data (not an echo), make it brighter
            if (tower.isEcho && !id.startsWith('echo-')) {
                tower.bar.material.opacity = 0.6;
                tower.isEcho = false;
            }

            tower.val = pm25;

            // Multi-color Cyber Gradient
            let colorHex = "#00f3ff";
            let color = 0x00f3ff;
            if (pm25 > 25) { color = 0x10b981; colorHex = "#10b981"; }
            if (pm25 > 37) { color = 0xf59e0b; colorHex = "#f59e0b"; }
            if (pm25 > 50) { color = 0xef4444; colorHex = "#ef4444"; }
            if (pm25 > 90) { color = 0xa855f7; colorHex = "#a855f7"; }
            tower.color = color;

            const targetHeight = Math.max(1.5, pm25 / 1.0); // Slightly taller for visual impact

            gsap.to(tower.bar.scale, { y: targetHeight, duration: 2.5, ease: "elastic.out(1, 0.4)" });
            gsap.to(tower.bar.position, { y: targetHeight / 2, duration: 2.5, ease: "elastic.out(1, 0.4)" });
            gsap.to(tower.top.position, { y: targetHeight, duration: 2.5, ease: "elastic.out(1, 0.4)" });

            tower.bar.material.color.setHex(color);
            tower.bar.material.emissive.setHex(color);
            tower.top.material.color.setHex(color);

            // UPDATE OR CREATE TEXT LABEL
            if (tower.textLabel) tower.group.remove(tower.textLabel);
            const displayText = `${pm25.toFixed(1)} | ${name}`;
            tower.textLabel = createTextSprite(displayText, colorHex);
            tower.textLabel.position.y = targetHeight + 3.5;
            tower.group.add(tower.textLabel);

            // Pulse Wave on arrival
            if (Math.random() > 0.6) createRing(tower.group.position, color);

            updateLeaderboard();
        }

        function updateLeaderboard() {
            const list = Object.values(towers).sort((a, b) => b.val - a.val).slice(0, 15);
            const container = document.getElementById('hotspot-list');
            container.innerHTML = list.map(t => `
                <div class="stat-item">
                    <span title="${t.name}">${t.name.substring(0, 18)}${t.name.length > 18 ? '..' : ''}</span>
                    <span class="pm25-val" style="color: #${t.color.toString(16).padStart(6, '0')}">${t.val.toFixed(1)}</span>
                </div>
            `).join('');
        }

        function initMQTT() {
            try {
                // Seed initial "Quantum Echoes" (Simulation) to fill the grid immediately
                for (let i = 0; i < 80; i++) {
                    const id = `echo-${i}`;
                    const dNames = ["DATA_NODE", "SIGNAL_HUB", "QUANTUM_RELAY", "GRID_LINK", "CYBER_CORE"];
                    const name = dNames[i % dNames.length] + "_" + (i + 1).toString().padStart(3, '0');
                    const mockPM = 5 + Math.random() * 25;
                    updateTower(id, mockPM, name);
                    if (towers[id]) {
                        towers[id].isEcho = true;
                        towers[id].bar.material.opacity = 0.2; // Dim echoes
                    }
                }

                const client = mqtt.connect('wss://dustboy-wss-bridge.laris.workers.dev/mqtt');
                client.on('connect', () => {
                    document.getElementById('status-dot').classList.add('active');
                    document.getElementById('status-text').innerText = 'QUANTUM GRID ACTIVE - STREAMING DATA';

                    // Subscribe with wildcards to get massive data
                    client.subscribe('DUSTBOY/+/+/+/status');
                    client.subscribe('DUSTBOY/+/+/status');
                    client.subscribe('DUSTBOY/+/status');
                });
                client.on('message', (topic, msg) => {
                    try {
                        const data = JSON.parse(msg.toString());
                        const parts = topic.split('/');
                        const id = parts[2] || parts[1];
                        updateTower(id, parseFloat(data.pm25) || 0, data.nickname || data.nickname_en || `ID-${id}`);
                    } catch (e) { }
                });
            } catch (e) { console.error("MQTT Error:", e); }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            if (controls) controls.update();
            if (starField) starField.rotation.y += 0.0003;
            if (scanLine) scanLine.position.z = Math.sin(time * 0.4) * 250;

            for (let i = dataRings.length - 1; i >= 0; i--) {
                const ring = dataRings[i];
                ring.scale += 0.2;
                ring.opacity -= 0.012;
                ring.mesh.scale.set(ring.scale, ring.scale, 1);
                ring.mesh.material.opacity = ring.opacity;
                if (ring.opacity <= 0) {
                    scene.remove(ring.mesh);
                    dataRings.splice(i, 1);
                }
            }

            Object.values(towers).forEach(t => {
                const speed = 1.5 + (t.val * 0.05);
                t.sat.position.set(
                    Math.cos(time * speed) * 3,
                    t.bar.scale.y + Math.sin(time * speed * 1.5) * 0.8 + 1.2,
                    Math.sin(time * speed) * 3
                );
                t.sat.rotation.y += 0.1;
                t.sat.rotation.z += 0.05;
            });

            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
