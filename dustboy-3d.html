<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum DustBoy 3D | Real-time Data Visualization</title>
    <style>
        :root {
            --accent: #00f3ff;
            --danger: #ff0055;
            --bg: #050505;
            --glass: rgba(15, 23, 42, 0.8);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .card {
            background: var(--glass);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 15px;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status {
            font-size: 0.8rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }

        .dot.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        #leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            z-index: 100;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .pm25-val {
            font-weight: bold;
            color: var(--accent);
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.7rem;
            opacity: 0.6;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

    <!-- Dependencies -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="loading">QUANTUM CORE INITIALIZING...</div>

    <div id="ui-overlay">
        <div class="card">
            <h1>DUSTBOY 3D VISUAL</h1>
            <div class="status">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">Connecting to WSS Bridge...</span>
            </div>
            <div style="margin-top: 15px; font-size: 0.8rem; opacity: 0.8;">
                Real-time Cyber City of Air Quality<br>
                Height = PM2.5 Level
            </div>
        </div>
    </div>

    <div id="leaderboard">
        <div class="card">
            <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; color: var(--accent);">HOTSPOTS
                (PM2.5)</div>
            <div id="hotspot-list">
                <div style="font-size: 0.8rem; opacity: 0.5;">Scanning stations...</div>
            </div>
        </div>
    </div>

    <div class="legend">
        Created by Antigravity Oracle | Final Quiz PSRU | 2026
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let towers = {};

        init3D();
        initMQTT();

        function init3D() {
            try {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x020617);
                scene.fog = new THREE.Fog(0x020617, 20, 150);

                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(40, 40, 40);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                document.body.appendChild(renderer.domElement);

                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.5;

                // Lights
                const ambient = new THREE.AmbientLight(0xffffff, 0.5);
                scene.add(ambient);

                const pointLight = new THREE.PointLight(0x00f3ff, 2, 100);
                pointLight.position.set(10, 50, 10);
                scene.add(pointLight);

                // Neon Grid
                const grid = new THREE.GridHelper(300, 60, 0x00f3ff, 0x0f172a);
                grid.position.y = -0.1;
                scene.add(grid);

                animate();

                // Hide loading
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            } catch (err) {
                console.error("Init3D failed:", err);
                document.getElementById('loading').innerText = "ERROR INITIALIZING CORE: " + err.message;
            }
        }

        function createTower(id, name) {
            const group = new THREE.Group();

            // Base/Foundation
            const baseGeo = new THREE.BoxGeometry(1.5, 0.2, 1.5);
            const baseMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, emissive: 0x00f3ff, emissiveIntensity: 0.1 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            group.add(base);

            // The main data bar
            const barGeo = new THREE.BoxGeometry(1, 1, 1);
            const barMat = new THREE.MeshPhongMaterial({
                color: 0x00f3ff,
                transparent: true,
                opacity: 0.7,
                emissive: 0x00f3ff,
                emissiveIntensity: 0.3
            });
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.y = 0.5;
            group.add(bar);

            // Glow Top
            const topGeo = new THREE.BoxGeometry(1.1, 0.1, 1.1);
            const topMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 1;
            group.add(top);

            // Position (Random field)
            const angle = Math.random() * Math.PI * 2;
            const radius = 15 + Math.random() * 50;
            group.position.x = Math.cos(angle) * radius;
            group.position.z = Math.sin(angle) * radius;

            scene.add(group);
            return { group, bar, top, val: 0, name };
        }

        function updateTower(id, pm25, name) {
            if (!towers[id]) {
                towers[id] = createTower(id, name);
            }

            const tower = towers[id];
            tower.val = pm25;

            // Color based on PM2.5
            let color = 0x00f3ff;
            if (pm25 > 25) color = 0x4ade80;
            if (pm25 > 37) color = 0xfacc15;
            if (pm25 > 50) color = 0xf97316;
            if (pm25 > 90) color = 0xff0055;

            // Animation
            const targetHeight = Math.max(0.5, pm25 / 2);

            gsap.to(tower.bar.scale, { y: targetHeight, duration: 1.2, ease: "power2.out" });
            gsap.to(tower.bar.position, { y: targetHeight / 2, duration: 1.2, ease: "power2.out" });
            gsap.to(tower.top.position, { y: targetHeight, duration: 1.2, ease: "power2.out" });

            tower.bar.material.color.setHex(color);
            tower.bar.material.emissive.setHex(color);
            tower.top.material.color.setHex(color);

            updateLeaderboard();
        }

        function updateLeaderboard() {
            const list = Object.values(towers)
                .sort((a, b) => b.val - a.val)
                .slice(0, 10);

            const container = document.getElementById('hotspot-list');
            container.innerHTML = list.map(t => `
                <div class="stat-item">
                    <span title="${t.name}">${t.name.substring(0, 15)}${t.name.length > 15 ? '..' : ''}</span>
                    <span class="pm25-val">${t.val.toFixed(1)}</span>
                </div>
            `).join('');
        }

        function initMQTT() {
            const BROKER = 'wss://dustboy-wss-bridge.laris.workers.dev/mqtt';
            const TOPIC = 'DUSTBOY/+/+/+/status';

            try {
                const client = mqtt.connect(BROKER);
                const statusDot = document.getElementById('status-dot');
                const statusText = document.getElementById('status-text');

                client.on('connect', () => {
                    statusDot.classList.add('active');
                    statusText.innerText = 'Quantum Grid Active - Receiving Data';
                    client.subscribe(TOPIC);
                });

                client.on('message', (topic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        const id = topic.split('/')[2];
                        const name = data.nickname || data.nickname_en || `Station ${id}`;
                        const pm25 = parseFloat(data.pm25) || 0;
                        updateTower(id, pm25, name);
                    } catch (e) { }
                });

                client.on('error', (err) => {
                    statusText.innerText = 'Connection Error: ' + err.message;
                });
            } catch (err) {
                console.error("MQTT Init failed:", err);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            }
            if (renderer) renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
