<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Voxel Railway | Minecraft Style</title>
    <style>
        :root {
            --bg-color: #7dd3fc;
            --accent-color: #facc15;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
        }

        #ui-card {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 2px solid #556b2f;
            min-width: 280px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .sun-icon {
            font-size: 1.4rem;
        }

        #train-title {
            margin: 0;
            font-size: 1.1rem;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        #province-name {
            margin: 5px 0;
            font-size: 1.4rem;
            color: #ef4444;
            font-weight: 800;
        }

        .time-label {
            color: #4ade80;
            font-size: 1.1rem;
            font-weight: 800;
            font-family: monospace;
        }

        .info-details {
            margin-top: 10px;
            font-size: 0.75rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .info-details span {
            color: #fbbf24;
        }

        #controls-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .btn {
            background: #4ade80;
            color: #064e3b;
            border: 2px solid #064e3b;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #22c55e;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-color);
            z-index: 9999;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 3px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loading">GENERATING VOXEL WORLD...</div>

    <div id="ui-card">
        <div class="header-row">
            <span class="sun-icon">⛏️</span>
            <h2 id="train-title">ขบวน 8 — Voxel Express</h2>
        </div>
        <div id="province-name">Loading Terrain...</div>
        <div class="time-label" id="current-time">00:00</div>

        <div class="info-details">
            World: <span>Chiang Mai → Phitsanulok</span><br>
            Style: <span>Minecraft Voxel</span><br>
            Antigravity — Blocky Force
        </div>
    </div>

    <div id="controls-bar">
        <button class="btn" onclick="togglePlay()"><span id="pause-icon">II</span> Pause</button>
        <button class="btn" onclick="toggleCamera()"><span id="cam-icon">🚂</span> Follow</button>
        <button class="btn" style="background: #fbbf24; color: #78350f; border-color: #78350f;"
            onclick="resetJourney()">↺ Respawn</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let train, points = [], waypointsData = [];
        let currentIdx = 0;
        let clock = new THREE.Clock();
        let curve, trainCars = [];
        let isPlaying = true;
        let followTrain = true;
        let curveTimer = 0;
        let steamParticles = [];

        const SCALE = 500;
        const VOXEL_SIZE = 1;

        init();

        async function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7dd3fc);
            scene.fog = new THREE.Fog(0x7dd3fc, 150, 800);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
            camera.position.set(0, 100, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
            sunLight.position.set(100, 200, 100);
            scene.add(sunLight);

            // Voxel Ground
            const groundGroup = new THREE.Group();
            const grassGeo = new THREE.BoxGeometry(2000, 2, 2000);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x556b2f }); // Minecraft Green
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.position.y = -1.1;
            scene.add(grass);

            // Grid decoration
            const grid = new THREE.GridHelper(2000, 100, 0x3b4a20, 0x3b4a20);
            grid.position.y = -0.05;
            scene.add(grid);

            await loadCSV();

            if (points.length > 1) {
                curve = new THREE.CatmullRomCurve3(points);
                createEnvironment();
                createVoxelTrain();
                animate();

                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').remove(), 500);
            } else {
                document.getElementById('loading').innerText = "FATAL: NO TRACK DATA FOUND";
                console.error("Points length <= 1");
            }
        }

        async function loadCSV() {
            try {
                const response = await fetch('travel-phitsanulok.csv');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.text();

                const rows = data.split('\n').filter(line => line.trim().length > 0);
                const header = rows[0].split(',');
                const lines = rows.slice(1);

                const latIdx = header.indexOf('lat');
                const lonIdx = header.indexOf('lon');
                const timeIdx = header.indexOf('updated');
                const addrIdx = header.indexOf('address');

                let midLat = 0, midLon = 0, validCount = 0;
                const rawRows = lines.map(line => {
                    const r = line.split(',');
                    // Early columns (lat/lon) are safe from address commas
                    return r.length > latIdx && !isNaN(parseFloat(r[latIdx])) ? r : null;
                }).filter(r => r !== null);

                rawRows.forEach(r => {
                    midLat += parseFloat(r[latIdx]);
                    midLon += parseFloat(r[lonIdx]);
                    validCount++;
                });

                if (validCount === 0) return;

                midLat /= validCount;
                midLon /= validCount;

                rawRows.forEach(r => {
                    const lat = parseFloat(r[latIdx]);
                    const lon = parseFloat(r[lonIdx]);
                    const x = (lon - midLon) * SCALE;
                    const z = (midLat - lat) * SCALE;
                    points.push(new THREE.Vector3(x, 0.5, z));

                    const addr = r[addrIdx] || "";
                    // Best effort to get province if address is quoted and has commas
                    const province = addr.includes(',') ? addr.split(',').pop().trim().split(' ')[0] : "Province";

                    waypointsData.push({
                        province: province,
                        time: r[timeIdx]?.split(' ')[1] || "00:00"
                    });
                });
            } catch (e) {
                console.error("CSV Fail", e);
            }
        }

        function createEnvironment() {
            points.forEach((p, i) => {
                if (i % 8 === 0) {
                    if (Math.random() > 0.4) createVoxelTree(p);
                    if (Math.random() > 0.8) createVoxelMountain(p);
                }
            });
        }

        function createVoxelTree(pos) {
            const group = new THREE.Group();

            // Trunk
            const trunkGeo = new THREE.BoxGeometry(0.5, 2, 0.5);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a3728 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1;
            group.add(trunk);

            // Leaves
            const leaveMat = new THREE.MeshLambertMaterial({ color: 0x2d4c1e });
            const layer1 = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 2), leaveMat);
            layer1.position.y = 2.5;
            group.add(layer1);

            const layer2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), leaveMat);
            layer2.position.y = 3.3;
            group.add(layer2);

            group.position.copy(pos);
            group.position.x += (Math.random() - 0.5) * 15;
            group.position.z += (Math.random() - 0.5) * 15;
            scene.add(group);
        }

        function createVoxelMountain(pos) {
            const group = new THREE.Group();
            const mat = new THREE.MeshLambertMaterial({ color: 0x4b5563 });

            const baseSize = 4 + Math.random() * 6;
            for (let h = 0; h < 3; h++) {
                const s = baseSize - h * 2;
                if (s <= 0) break;
                const block = new THREE.Mesh(new THREE.BoxGeometry(s, 2, s), mat);
                block.position.y = h * 2;
                group.add(block);
            }

            group.position.copy(pos);
            const side = Math.random() > 0.5 ? 25 : -25;
            group.position.x += side + (Math.random() - 0.5) * 10;
            group.position.z += (Math.random() - 0.5) * 10;
            scene.add(group);
        }

        function createVoxelTrain() {
            train = new THREE.Group();
            const colors = [0x3b82f6, 0xef4444, 0xfacc15, 0x10b981];

            for (let i = 0; i < 4; i++) {
                const car = createVoxelCar(colors[i], i === 0);
                train.add(car);
                trainCars.push(car);
            }
            scene.add(train);
        }

        function createVoxelCar(color, isLoco) {
            const group = new THREE.Group();

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 2.2), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 0.8;
            group.add(body);

            if (isLoco) {
                // Cabin
                const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1), new THREE.MeshLambertMaterial({ color: 0x1e293b }));
                cabin.position.set(0, 1.7, -0.4);
                group.add(cabin);

                // Chimney
                const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, 0.4), new THREE.MeshLambertMaterial({ color: 0x000000 }));
                chimney.position.set(0, 1.7, 0.6);
                group.add(chimney);
            }

            // Wheels (Square Wheels for Voxel feel)
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111827 });
            [[-0.6, 0.3, 0.7], [0.6, 0.3, 0.7], [-0.6, 0.3, -0.7], [0.6, 0.3, -0.7]].forEach(p => {
                const wheel = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.4), wheelMat);
                wheel.position.set(...p);
                group.add(wheel);
            });

            return group;
        }

        function createSteam(pos) {
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
            const p = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat);
            p.position.copy(pos);
            p.position.y += 2.2;
            scene.add(p);
            steamParticles.push({
                mesh: p,
                life: 1.0,
                vel: new THREE.Vector3((Math.random() - 0.5) * 0.1, 0.1 + Math.random() * 0.1, (Math.random() - 0.5) * 0.1)
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isPlaying && curve) {
                curveTimer += delta * 0.012;
                if (curveTimer > 1) curveTimer = 0;

                const OFFSET = 0.005;
                trainCars.forEach((car, i) => {
                    const t = (curveTimer - (i * OFFSET) + 1) % 1;
                    const pos = curve.getPointAt(t);
                    const lookAtT = (t + 0.002) % 1;
                    const lookPos = curve.getPointAt(lookAtT);

                    car.position.lerp(pos, 0.2);
                    car.lookAt(lookPos);
                });

                if (Math.random() > 0.7) createSteam(trainCars[0].position);

                const currentPointIdx = Math.floor(curveTimer * points.length);
                if (currentPointIdx !== currentIdx) {
                    currentIdx = currentPointIdx;
                    updateUI(currentIdx % points.length);
                }

                if (followTrain) {
                    const head = trainCars[0];
                    const offset = new THREE.Vector3(0, 15, -35).applyMatrix4(head.matrixWorld);
                    camera.position.lerp(offset, 0.1);
                    controls.target.lerp(head.position, 0.1);
                }
            }

            // Update Steam
            for (let i = steamParticles.length - 1; i >= 0; i--) {
                const sp = steamParticles[i];
                sp.mesh.position.add(sp.vel);
                sp.mesh.scale.multiplyScalar(1.02);
                sp.life -= 0.02;
                sp.mesh.material.opacity = sp.life * 0.6;
                if (sp.life <= 0) {
                    scene.remove(sp.mesh);
                    steamParticles.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function updateUI(idx) {
            const data = waypointsData[idx];
            if (!data) return;
            document.getElementById('province-name').innerText = data.province;
            document.getElementById('current-time').innerText = data.time;
        }

        window.togglePlay = () => {
            isPlaying = !isPlaying;
            document.getElementById('pause-icon').innerText = isPlaying ? "II" : "▶";
        };

        window.toggleCamera = () => {
            followTrain = !followTrain;
        };

        window.resetJourney = () => {
            curveTimer = 0;
            isPlaying = true;
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
