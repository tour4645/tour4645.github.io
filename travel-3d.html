<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Txur Oracle | 3D Quantum Train</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #facc15;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Outfit', sans-serif;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-main);
            z-index: 100;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(250, 204, 21, 0.2);
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-color);
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: var(--accent-color);
            font-size: 0.7rem;
            opacity: 0.6;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loading">QUANTUM CORE INITIALIZING...</div>

    <div id="ui">
        <h1>3D Quantum Logistics</h1>
        <div class="stats" id="current-pos">Analyzing Waypoints...</div>
    </div>

    <div class="footer">Txur Oracle | PSRU Workshop | 2026</div>

    <div class="controls">
        LMB: Rotate | RMB: Pan | Scroll: Zoom<br>
        Source: travel-phitsanulok.csv
    </div>

    <!-- Three.js CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let pathLine, train, points = [];
        let waypointsData = [];
        let currentIdx = 0;
        let clock = new THREE.Clock();
        let curve, trainCars = [];

        const SCALE = 500; // Scaling factor for coordinates

        init();

        async function init() {
            // Setup Scene
            scene = new THREE.Scene();
            // สีท้องฟ้าแบบธรรมชาติ (Light Sky Blue)
            scene.background = new THREE.Color(0xbae6fd);
            scene.fog = new THREE.Fog(0xbae6fd, 100, 1000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 8000);
            camera.position.set(0, 100, 200);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights (Natural Day Light)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(100, 200, 100);
            scene.add(sunLight);

            // Natural Grid
            const grid = new THREE.GridHelper(2000, 100, 0x94a3b8, 0xcbd5e1);
            scene.add(grid);

            // Ground Plane (Natural Ground)
            const groundGeo = new THREE.PlaneGeometry(5000, 5000);
            const groundMat = new THREE.MeshPhongMaterial({ color: 0xdcfce7 }); // Soft Green Ground
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.05;
            scene.add(ground);

            // Load Data
            await loadCSV();

            if (points.length > 1) {
                // สร้างเส้นทางด้วย CatmullRomCurve3
                curve = new THREE.CatmullRomCurve3(points);
                curve.curveType = 'catmullrom';
                curve.tension = 0.5;

                createRoute();
                createTrain();

                // เริ่มต้นที่จุดแรก
                const startPos = curve.getPoint(0);
                camera.position.set(startPos.x, 30, startPos.z + 50);
                controls.target.copy(startPos);

                animate();
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').remove(), 500);
            }
        }

        async function loadCSV() {
            try {
                const response = await fetch('travel-phitsanulok.csv');
                if (!response.ok) throw new Error("ไม่สามารถโหลดไฟล์ CSV ได้");
                const data = await response.text();

                const parseCSV = (str) => {
                    const arr = [];
                    let quote = false;
                    let col = "";
                    let row = [];
                    const cleanStr = str.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                    for (let i = 0; i < cleanStr.length; i++) {
                        const char = cleanStr[i];
                        if (char === '"') { quote = !quote; continue; }
                        if (char === ',' && !quote) { row.push(col.trim()); col = ""; continue; }
                        if (char === '\n' && !quote) {
                            if (col || row.length) {
                                row.push(col.trim());
                                arr.push(row);
                            }
                            col = ""; row = []; continue;
                        }
                        col += char;
                    }
                    if (col || row.length) { row.push(col.trim()); arr.push(row); }
                    return arr;
                };

                const rows = parseCSV(data).slice(1);
                let midLat = 0, midLon = 0;
                let validCount = 0;
                const rawData = rows.filter(c => c.length > 5 && c[4] && c[5] && !isNaN(parseFloat(c[4])));

                rawData.forEach(cols => {
                    midLat += parseFloat(cols[4]);
                    midLon += parseFloat(cols[5]);
                    validCount++;
                });

                if (validCount === 0) return;
                midLat /= validCount;
                midLon /= validCount;

                rawData.forEach((cols) => {
                    const lat = parseFloat(cols[4]);
                    const lon = parseFloat(cols[5]);
                    const x = (lon - midLon) * SCALE;
                    const z = (midLat - lat) * SCALE;
                    const y = 0.1;
                    points.push(new THREE.Vector3(x, y, z));
                    // ดึงชื่อจังหวัดจาก address (ตัวอย่าง: "..., Lampang 52190")
                    const address = cols[11] || "";
                    const addrParts = address.split(',');
                    const provinceInfo = addrParts.length > 1 ? addrParts[addrParts.length - 1].trim().split(' ')[0] : (cols[10] || "กำลังเดินทาง...");

                    waypointsData.push({
                        place: cols[10] || "Unknown",
                        province: provinceInfo,
                        time: cols[12]?.split(' ')[1] || "??:??",
                        bat: cols[2] || "0"
                    });
                });
            } catch (e) {
                console.error("CSV Load failed", e);
            }
        }

        function createRoute() {
            const curvePoints = curve.getPoints(points.length * 12);
            const geometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
            const material = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4 });
            pathLine = new THREE.Line(geometry, material);
            scene.add(pathLine);

            // Environment (Natural Style - More Trees)
            points.forEach((p, i) => {
                if (i % 4 === 0) { // เพิ่มความถี่
                    const dotGeo = new THREE.SphereGeometry(0.15, 12, 12);
                    const dotMat = new THREE.MeshPhongMaterial({ color: 0x60a5fa, emissive: 0x60a5fa, emissiveIntensity: 0.3 });
                    const dot = new THREE.Mesh(dotGeo, dotMat);
                    dot.position.copy(p);
                    scene.add(dot);

                    // สุ่มต้นไม้ให้เยอะขึ้น
                    if (Math.random() > 0.4) addDecorativeObject(p);
                    if (Math.random() > 0.7) addDecorativeObject(p);
                }
            });
        }

        function addDecorativeObject(pos) {
            const type = Math.random();
            const container = new THREE.Group();
            if (type > 0.5) {
                const trunkGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.5);
                const trunkMat = new THREE.MeshPhongMaterial({ color: 0x3d2b1f });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                const leavesGeo = new THREE.ConeGeometry(0.4, 0.8, 4);
                const leavesMat = new THREE.MeshPhongMaterial({ color: 0x22c55e });
                const leaves = new THREE.Mesh(leavesGeo, leavesMat);
                leaves.position.y = 0.5;
                container.add(trunk, leaves);
            } else {
                const cryGeo = new THREE.OctahedronGeometry(0.3);
                const cryMat = new THREE.MeshPhongMaterial({
                    color: 0xa855f7, emissive: 0xa855f7, emissiveIntensity: 0.5, transparent: true, opacity: 0.8
                });
                container.add(new THREE.Mesh(cryGeo, cryMat));
            }
            container.position.copy(pos);
            container.position.x += (Math.random() - 0.5) * 5;
            container.position.z += (Math.random() - 0.5) * 5;
            container.scale.setScalar(0.5 + Math.random());
            scene.add(container);
        }

        function createTrain() {
            train = new THREE.Group();
            trainCars = [];
            const loco = createCarriage(0x3b82f6, true);
            train.add(loco);
            trainCars.push(loco);
            const colors = [0xf97316, 0xef4444, 0x8b5cf6];
            for (let i = 0; i < 3; i++) {
                const car = createCarriage(colors[i % colors.length], false);
                train.add(car);
                trainCars.push(car);
            }
            scene.add(train);
        }

        function createCarriage(color, isLoco) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(0.6, 0.5, 1.4);
            const bodyMat = new THREE.MeshPhongMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.3;
            group.add(body);
            if (isLoco) {
                const cabinGeo = new THREE.BoxGeometry(0.62, 0.4, 0.6);
                const cabinMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
                const cabin = new THREE.Mesh(cabinGeo, cabinMat);
                cabin.position.set(0, 0.7, -0.3);
                group.add(cabin);
                const chimneyGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.4, 16);
                const chimneyMat = new THREE.MeshPhongMaterial({ color: 0x334155 });
                const chimney = new THREE.Mesh(chimneyGeo, chimneyMat);
                chimney.position.set(0, 0.7, 0.4);
                group.add(chimney);
                const headLight = new THREE.SpotLight(0xffffff, 15, 30, Math.PI / 6);
                headLight.position.set(0, 0.5, 0.7);
                group.add(headLight);
                group.add(headLight.target);
                headLight.target.position.set(0, 0.5, 10);
            } else {
                const winGeo = new THREE.BoxGeometry(0.62, 0.15, 0.2);
                const winMat = new THREE.MeshPhongMaterial({ color: 0xbae6fd });
                [-0.3, 0.1, 0.5].forEach(z => {
                    const winSide = new THREE.Mesh(winGeo, winMat);
                    winSide.position.set(0, 0.45, z);
                    group.add(winSide);
                });
            }
            const wheelGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.12, 16);
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x0f172a });
            [[-0.3, 0.18, 0.5], [0.3, 0.18, 0.5], [-0.3, 0.18, -0.5], [0.3, 0.18, -0.5]].forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                group.add(wheel);
            });
            return group;
        }

        let curveTimer = 0;
        const CAR_OFFSET = 0.0035; // ลดระยะให้ติดกัน (Realistic)

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // ใช้ delta เพื่อความเร็วคงที่เสมอ
            curveTimer += delta * 0.012;
            if (curveTimer > 1) curveTimer = 0;

            if (curve && trainCars.length > 0) {
                trainCars.forEach((car, i) => {
                    const t = (curveTimer - (i * CAR_OFFSET) + 1) % 1;
                    const pos = curve.getPointAt(t);

                    // หาจุดข้างหน้าเพื่อการหมุนที่ลื่นตัวขึ้น
                    const lookT = (t + 0.002) % 1;
                    const nextPos = curve.getPointAt(lookT);

                    // ใช้ Lerp สำหรับตำแหน่งเพื่อแก้ปัญหาการ "กระชาก"
                    car.position.lerp(pos, 0.25);
                    car.lookAt(nextPos);
                });

                const currentPointIdx = Math.floor(curveTimer * points.length);
                if (currentPointIdx !== currentIdx) {
                    currentIdx = currentPointIdx;
                    updateUI(currentIdx % points.length);
                }

                const headCar = trainCars[0];
                if (headCar) {
                    const relativeCameraOffset = new THREE.Vector3(0, 15, -35);
                    const cameraOffset = relativeCameraOffset.applyMatrix4(headCar.matrixWorld);
                    camera.position.lerp(cameraOffset, 0.04);
                    controls.target.lerp(headCar.position, 0.08);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function updateUI(idx) {
            const data = waypointsData[idx];
            if (!data) return;
            document.getElementById('current-pos').innerHTML =
                `<span style="color: #facc15; font-weight: bold;">📍 ${data.province}</span> | ${data.place} | ${data.time} | 🔋${data.bat}%`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
