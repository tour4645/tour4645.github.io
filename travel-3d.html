<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Txur Oracle | 3D Quantum Train</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #facc15;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-color);
            font-family: 'Outfit', sans-serif;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-main);
            z-index: 100;
            pointer-events: none;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(250, 204, 21, 0.2);
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-color);
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: var(--accent-color);
            font-size: 0.7rem;
            opacity: 0.6;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loading">QUANTUM CORE INITIALIZING...</div>

    <div id="ui">
        <h1>3D Quantum Logistics</h1>
        <div class="stats" id="current-pos">Analyzing Waypoints...</div>
    </div>

    <div class="footer">Txur Oracle | PSRU Workshop | 2026</div>

    <div class="controls">
        LMB: Rotate | RMB: Pan | Scroll: Zoom<br>
        Source: travel-phitsanulok.csv
    </div>

    <!-- Three.js CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let pathLine, train, points = [];
        let waypointsData = [];
        let currentIdx = 0;
        let clock = new THREE.Clock();

        const SCALE = 500; // Scaling factor for coordinates

        init();

        async function init() {
            // Setup Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            // ปรับระยะ Fog ให้กว้างขึ้นเพื่อให้มองเห็นโมเดลได้ชัดเจน
            scene.fog = new THREE.Fog(0x050505, 50, 500);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 50, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xfacc15, 2, 500);
            pointLight.position.set(50, 50, 50);
            scene.add(pointLight);

            // Grid
            const grid = new THREE.GridHelper(500, 50, 0x333333, 0x111111);
            scene.add(grid);

            // Load Data
            await loadCSV();

            if (points.length > 0) {
                createRoute();
                createTrain();

                // เลื่อนกล้องไปโฟกัสที่จุดเริ่มต้น
                camera.position.set(points[0].x, 20, points[0].z + 40);
                controls.target.copy(points[0]);

                animate();
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').remove(), 500);
            }
        }

        async function loadCSV() {
            try {
                const response = await fetch('travel-phitsanulok.csv');
                if (!response.ok) throw new Error("ไม่สามารถโหลดไฟล์ CSV ได้");
                const data = await response.text();

                // ปรับปรุง CSV Parser ให้รองรับเครื่องหมาย " " และป้องกันข้อมูลคลาดเคลื่อน
                const parseCSV = (str) => {
                    const arr = [];
                    let quote = false;
                    let col = "";
                    let row = [];
                    const cleanStr = str.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                    for (let i = 0; i < cleanStr.length; i++) {
                        const char = cleanStr[i];
                        if (char === '"') { quote = !quote; continue; }
                        if (char === ',' && !quote) { row.push(col.trim()); col = ""; continue; }
                        if (char === '\n' && !quote) {
                            if (col || row.length) {
                                row.push(col.trim());
                                arr.push(row);
                            }
                            col = ""; row = []; continue;
                        }
                        col += char;
                    }
                    if (col || row.length) { row.push(col.trim()); arr.push(row); }
                    return arr;
                };

                const rows = parseCSV(data).slice(1); // ข้ามหัวตาราง

                // หาค่ากลางเพื่อจัดตำแหน่งพิกัด (Normalization)
                let midLat = 0, midLon = 0;
                let validCount = 0;

                const rawData = rows.filter(c => c.length > 5 && c[4] && c[5] && !isNaN(parseFloat(c[4])));

                rawData.forEach(cols => {
                    midLat += parseFloat(cols[4]);
                    midLon += parseFloat(cols[5]);
                    validCount++;
                });

                if (validCount === 0) return;

                midLat /= validCount;
                midLon /= validCount;

                rawData.forEach((cols, i) => {
                    const lat = parseFloat(cols[4]);
                    const lon = parseFloat(cols[5]);

                    // แปลงพิกัดเป็น 3D Coords
                    const x = (lon - midLon) * SCALE;
                    const z = (midLat - lat) * SCALE;
                    const y = 0.1; // วางสูงกว่าพื้นเล็กน้อย

                    const v = new THREE.Vector3(x, y, z);
                    points.push(v);

                    // อ้างอิง index จากหัวตาราง: 0:device, 2:battery, 4:lat, 5:lon, 10:locality, 12:updated
                    waypointsData.push({
                        place: cols[10] || cols[8] || "กำลังเดินทาง...",
                        time: cols[12]?.split(' ')[1] || "??:??",
                        bat: cols[2] || "0"
                    });
                });

            } catch (e) {
                console.error("CSV Load failed", e);
            }
        }

        function createRoute() {
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.5 });
            pathLine = new THREE.Line(geometry, material);
            scene.add(pathLine);

            // Glowing path markers
            points.forEach((p, i) => {
                if (i % 10 === 0) {
                    const dotGeo = new THREE.SphereGeometry(0.05, 8, 8);
                    const dotMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
                    const dot = new THREE.Mesh(dotGeo, dotMat);
                    dot.position.copy(p);
                    scene.add(dot);
                }
            });
        }

        function createTrain() {
            const group = new THREE.Group();

            // Main Body (Locomotive)
            const bodyGeo = new THREE.BoxGeometry(0.5, 0.4, 1.2);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0xfacc15, emissiveIntensity: 0.1 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.25;
            group.add(body);

            // Cabin
            const cabinGeo = new THREE.BoxGeometry(0.5, 0.4, 0.5);
            const cabinMat = new THREE.MeshPhongMaterial({ color: 0x222222, emissive: 0xfacc15, emissiveIntensity: 0.2 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.6, -0.3);
            group.add(cabin);

            // Chimney
            const chimneyGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.3, 16);
            const chimneyMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
            const chimney = new THREE.Mesh(chimneyGeo, chimneyMat);
            chimney.position.set(0, 0.6, 0.4);
            group.add(chimney);

            // Wheels (6 wheels)
            const wheelGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.1, 16);
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x000000 });

            const wheelPositions = [
                [-0.26, 0.12, 0.4], [0.26, 0.12, 0.4],
                [-0.26, 0.12, 0], [0.26, 0.12, 0],
                [-0.26, 0.12, -0.4], [0.26, 0.12, -0.4]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                group.add(wheel);
            });

            // Neon Accents
            const neonMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            const stripGeo = new THREE.BoxGeometry(0.52, 0.02, 1.22);
            const strip = new THREE.Mesh(stripGeo, neonMat);
            strip.position.y = 0.45;
            group.add(strip);

            // Spotlight (Headlight)
            const light = new THREE.SpotLight(0xfacc15, 5, 10, Math.PI / 6);
            light.position.set(0, 0.4, 0.6);
            light.target.position.set(0, 0.4, 2);
            group.add(light);
            group.add(light.target);

            // Point light for glow
            const pointLight = new THREE.PointLight(0xfacc15, 1, 5);
            pointLight.position.set(0, 1, 0);
            group.add(pointLight);

            train = group;
            scene.add(train);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Move train
            if (currentIdx < points.length - 1) {
                const start = points[currentIdx];
                const end = points[currentIdx + 1];

                // Speed calculation (simulated)
                const speed = 5.0;
                train.position.lerp(end, 0.1);

                if (train.position.distanceTo(end) < 0.1) {
                    currentIdx++;
                    updateUI(currentIdx);
                }

                // Make train look at next point
                train.lookAt(end);
            } else {
                currentIdx = 0; // Loop
                train.position.copy(points[0]);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function updateUI(idx) {
            const data = waypointsData[idx];
            if (!data) return;
            document.getElementById('current-pos').innerHTML =
                `Loc: ${data.place} | Time: ${data.time} | Power: ${data.bat}%`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>

</html>
